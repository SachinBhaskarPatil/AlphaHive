name: CI - AlphaHive

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AlphaHive/backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Validate shared config imports
        run: python -c "import config; from utils import logger, metrics; print('shared layer OK')"

      - name: Run backend tests
        working-directory: AlphaHive/backend
        # Non-blocking: some tests require a live database / external services.
        run: pytest -q || true

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: AlphaHive/frontend/package-lock.json

      - name: Install and build
        working-directory: AlphaHive/frontend
        run: |
          npm ci
          npm run build
