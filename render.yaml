# Render Blueprint — deploys backend API, frontend, and a free Postgres DB.
# Render auto-redeploys every one of these on each git push to the connected branch.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: market-rover-db
    plan: free

services:
  # ---------- Backend: FastAPI ----------
  - type: web
    name: market-rover-api
    runtime: python
    plan: free
    rootDir: market_rover/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DATABASE_URL
        fromDatabase:
          name: market-rover-db
          property: connectionString
      # Secrets — set these values in the Render dashboard (sync:false keeps them out of git)
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # ---------- Frontend: React + Vite (static) ----------
  - type: web
    name: market-rover-web
    runtime: static
    rootDir: market_rover/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      # Proxy API calls to the backend so the browser stays same-origin (no CORS needed)
      - type: rewrite
        source: /api/*
        destination: https://market-rover-api.onrender.com/api/*
      # SPA fallback — send everything else to index.html
      - type: rewrite
        source: /*
        destination: /index.html
